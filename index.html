<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="منصة B4C لطلاب البكالوريا شعبة الآداب والفلسفة">
  <title>B4C | منصة الآداب والفلسفة</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: #151f32;
      --surface2: #202d43;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #a5b4c8;
      --border: #304158;
      --danger: #f87171;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .accent { color: var(--accent); }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 34px 24px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 70px #0003;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin-bottom: 16px;
      border-radius: 20px;
      background: #38bdf81c;
      color: var(--accent);
      font-size: 30px;
    }

    h1 { margin: 0 0 10px; font-size: 1.7rem; }
    p { line-height: 1.7; }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface2);
      font-weight: 700;
    }

    .btn-primary {
      color: #071421;
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-google {
      width: 100%;
      margin-top: 16px;
      background: #fff;
      color: #111827;
      border-color: #fff;
    }

    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .error {
      margin-top: 14px;
      color: var(--danger);
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px max(16px, calc((100% - 960px) / 2));
      background: #151f32ed;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .brand { color: var(--accent); font-weight: 900; font-size: 1.05rem; }

    .user-nav { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .logout { color: var(--danger); background: #f8717114; border-color: #f8717130; }

    main {
      width: min(100% - 32px, 920px);
      margin: 20px auto;
      padding-bottom: 24px;
    }

    .hero { margin-bottom: 20px; }
    .hero h2 { margin-bottom: 6px; font-size: 1.55rem; }
    .hero p { margin-top: 0; color: var(--muted); }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .subject-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      min-height: 140px;
      padding: 20px;
      text-align: right;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .2s, transform .2s;
    }

    .subject-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .subject-icon { font-size: 1.8rem; }
    .subject-card strong { font-size: 1.05rem; }
    .subject-card small { color: var(--muted); line-height: 1.5; }

    .tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 30px;
      color: var(--accent);
      background: #38bdf815;
      font-size: .75rem;
    }

    .chat-page { display: flex; flex-direction: column; gap: 14px; }
    .chat-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: min(72vh, 680px);
      min-height: 380px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .chat-status { padding: 10px 15px; color: var(--muted); font-size: .8rem; border-bottom: 1px solid var(--border); }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .message-row { display: flex; gap: 8px; align-items: flex-start; max-width: 88%; }
    .message-row.mine { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }

    .message {
      padding: 10px 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 15px 4px 15px 15px;
    }

    .message.mine {
      background: #173b66;
      border-color: #28578a;
      border-radius: 4px 15px 15px 15px;
    }

    .message-author { display: block; margin-bottom: 4px; color: var(--accent); font-size: .75rem; font-weight: 800; }
    .message.mine .message-author { color: #bfdbfe; }
    .message-text { white-space: pre-wrap; line-height: 1.6; user-select: text; -webkit-user-select: text; }
    .message-time { display: block; margin-top: 6px; color: var(--muted); font-size: .68rem; }

    .reactions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .reaction-btn { padding: 3px 8px; border: 1px solid var(--border); border-radius: 20px; background: #0b1120; color: var(--text); font-size: 0.78rem; }
    .reaction-btn.active { border-color: var(--accent); }

    .composer { display: flex; gap: 8px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); }
    .composer input { width: 100%; padding: 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }

    /* Picker Popover */
    .reaction-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
    .reaction-box { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 10px 18px; display: flex; gap: 14px; font-size: 1.5rem; }
    .reaction-box span { cursor: pointer; transition: transform 0.1s; }
    .reaction-box span:hover { transform: scale(1.3); }

    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .message-row { max-width: 95%; }
    }
  </style>
</head>

<body>

  <!-- نافذة التفاعلات البسيطة -->
  <div class="reaction-modal" id="reactionModal" onclick="closePicker()">
    <div class="reaction-box" onclick="event.stopPropagation()">
      <span onclick="confirmEmoji('👍')">👍</span>
      <span onclick="confirmEmoji('😂')">😂</span>
      <span onclick="confirmEmoji('😮')">😮</span>
      <span onclick="confirmEmoji('😢')">😢</span>
      <span onclick="confirmEmoji('🚩')">🚩</span>
    </div>
  </div>

  <section id="authScreen" class="screen">
    <div class="auth-card">
      <div class="logo" aria-hidden="true">📚</div>
      <h1 class="accent">منصة B4C</h1>
      <p class="muted">فضاء المراجعة والتعاون لطلاب الآداب والفلسفة</p>
      <button id="googleLoginBtn" class="btn btn-google" type="button">
        <span aria-hidden="true">G</span>
        متابعة باستخدام Google
      </button>
      <p id="authError" class="error" role="alert" aria-live="polite"></p>
    </div>
  </section>

  <div id="appArea" class="hidden">
    <header>
      <div class="brand">📜 B4C | بكالوريا</div>
      <div class="user-nav">
        <img id="userAvatar" class="user-avatar" src="" alt="حسابي">
        <button id="logoutBtn" class="btn logout" type="button">تسجيل الخروج</button>
      </div>
    </header>

    <main>
      <section id="homePage">
        <div class="hero">
          <h2>موادك الدراسية 🎓</h2>
          <p>اختار المادة، راجع دروسك وناقش مع زملائك.</p>
        </div>

        <div class="cards">
          <button class="subject-card" data-room="philo" data-title="الفلسفة" type="button">
            <span class="subject-icon">🧠</span>
            <strong>الفلسفة</strong>
            <small>المقالات الجدلية والاستقصائية</small>
            <span class="tag">معامل 6</span>
          </button>

          <button class="subject-card" data-room="arabic" data-title="اللغة العربية" type="button">
            <span class="subject-icon">📚</span>
            <strong>اللغة العربية</strong>
            <small>القواعد والبلاغة والنقد</small>
            <span class="tag">معامل 5</span>
          </button>

          <button class="subject-card" data-room="history" data-title="التاريخ والجغرافيا" type="button">
            <span class="subject-icon">🌍</span>
            <strong>التاريخ والجغرافيا</strong>
            <small>المصطلحات والتواريخ والخرائط</small>
            <span class="tag">معامل 4</span>
          </button>

          <button class="subject-card" data-room="general" data-title="المنتدى العام" type="button">
            <span class="subject-icon">💬</span>
            <strong>المنتدى العام</strong>
            <small>أسئلة ومناقشات عامة</small>
            <span class="tag">عام</span>
          </button>
        </div>
      </section>

      <section id="subjectView" class="chat-page hidden">
        <div class="chat-top">
          <button id="backBtn" class="btn" type="button">→ المواد</button>
          <h2 id="subjectTitle">المناقشة</h2>
        </div>

        <div class="chat-box">
          <div id="chatStatus" class="chat-status" role="status">جاري الاتصال...</div>
          <div id="chatMessages" class="messages" aria-live="polite">
            <p class="empty">جاري تحميل الرسائل...</p>
          </div>

          <form id="chatForm" class="composer">
            <input id="userInput" type="text" maxlength="1000" autocomplete="off" placeholder="اكتب رسالتك..." aria-label="نص الرسالة" required>
            <button id="sendBtn" class="btn btn-primary" type="submit">إرسال</button>
          </form>
        </div>

        <p id="chatError" class="error" role="alert" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, off, query, orderByChild, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCi8tBwbrQ2N3HPK266BnyLBbNIBZ1ggsg",
      authDomain: "bac-af.firebaseapp.com",
      databaseURL: "https://bac-af-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bac-af",
      storageBucket: "bac-af.firebasestorage.app",
      messagingSenderId: "682004900162",
      appId: "1:682004900162:web:6e74a6308b9e713dd600db",
      measurementId: "G-SMW8DZY8EX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const $ = (id) => document.getElementById(id);

    const authScreen = $("authScreen");
    const appArea = $("appArea");
    const loginBtn = $("googleLoginBtn");
    const logoutBtn = $("logoutBtn");
    const authError = $("authError");
    const homePage = $("homePage");
    const subjectView = $("subjectView");
    const subjectTitle = $("subjectTitle");
    const chatMessages = $("chatMessages");
    const chatStatus = $("chatStatus");
    const chatError = $("chatError");
    const chatForm = $("chatForm");
    const userInput = $("userInput");
    const sendBtn = $("sendBtn");
    const userAvatar = $("userAvatar");

    const EMOJIS = ["👍", "😂", "😮", "😢", "🚩"];
    let currentUser = null;
    let currentRoom = null;
    let activeMessageId = null;
    let messagesCache = {}, reactionsCache = {};
    let stopMessages = null, stopReactions = null;

    function renderMessages() {
      chatMessages.innerHTML = '';
      const ids = Object.keys(messagesCache);

      if (ids.length === 0) {
        chatMessages.innerHTML = '<p class="empty">لا توجد رسائل بعد. كن أول من يشارك! 💬</p>';
        return;
      }

      ids.forEach((id) => {
        const msg = messagesCache[id];
        const isMe = currentUser && msg.uid === currentUser.uid;
        
        const row = document.createElement("div");
        row.className = `message-row ${isMe ? 'mine' : ''}`;

        const reactions = reactionsCache[id] || {};
        let reactionBadges = '';
        Object.values(reactions).forEach(e => {
          if (EMOJIS.includes(e)) reactionBadges += ` ${e}`;
        });

        row.innerHTML = `
          <img class="msg-avatar" src="${msg.photo || 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg'}" alt="">
          <div class="message ${isMe ? 'mine' : ''}">
            <span class="message-author">${isMe ? 'أنت' : (msg.sender || 'طالب')}</span>
            <div class="message-text">${msg.text}</div>
            ${reactionBadges ? `<div class="reactions"><span class="reaction-btn">${reactionBadges}</span></div>` : ''}
          </div>
        `;

        row.addEventListener('click', () => openPicker(id));
        chatMessages.appendChild(row);
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function openPicker(id) {
      activeMessageId = id;
      $("reactionModal").style.display = "flex";
    }

    window.closePicker = function() {
      $("reactionModal").style.display = "none";
    }

    window.confirmEmoji = async function(emoji) {
      if (activeMessageId && currentUser && currentRoom) {
        const target = ref(db, `rooms/${currentRoom}/reactions/${activeMessageId}/${currentUser.uid}`);
        await set(target, emoji);
      }
      closePicker();
    }

    function openSubject(room, title) {
      currentRoom = room;
      subjectTitle.textContent = title;
      homePage.classList.add("hidden");
      subjectView.classList.remove("hidden");

      if (stopMessages) stopMessages();
      if (stopReactions) stopReactions();

      const q = query(ref(db, `rooms/${room}/messages`), orderByChild("timestamp"), limitToLast(100));
      stopMessages = onValue(q, (snap) => {
        messagesCache = snap.val() || {};
        renderMessages();
      });

      stopReactions = onValue(ref(db, `rooms/${room}/reactions`), (snap) => {
        reactionsCache = snap.val() || {};
        renderMessages();
      });
    }

    function showHome() {
      subjectView.classList.add("hidden");
      homePage.classList.remove("hidden");
      if (stopMessages) stopMessages();
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || !currentUser) return;

      await push(ref(db, `rooms/${currentRoom}/messages`), {
        uid: currentUser.uid,
        sender: currentUser.displayName || "طالب",
        photo: currentUser.photoURL || "",
        text,
        timestamp: serverTimestamp()
      });

      userInput.value = "";
    });

    loginBtn.addEventListener("click", () => signInWithRedirect(auth, provider));
    logoutBtn.addEventListener("click", () => signOut(auth));
    $("backBtn").addEventListener("click", showHome);

    document.querySelectorAll("[data-room]").forEach((btn) => {
      btn.addEventListener("click", () => openSubject(btn.dataset.room, btn.dataset.title));
    });

    getRedirectResult(auth).catch(() => {});
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authScreen.classList.add("hidden");
        appArea.classList.remove("hidden");
        userAvatar.src = user.photoURL || "";
      } else {
        authScreen.classList.remove("hidden");
        appArea.classList.add("hidden");
      }
    });
  </script>
</body>
</html>

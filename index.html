<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الآداب والفلسفة - B4C</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* الهيدر العلوي */
        header { background-color: #111827; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
        header h1 { font-size: 1.1rem; color: #38bdf8; font-weight: 700; }
        .user-chip { background: #1f2937; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .user-chip input { background: transparent; border: none; color: #38bdf8; font-weight: bold; width: 90px; outline: none; font-size: 0.8rem; }

        /* منطقة المحتوى الرئيسية */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* التبويبات الثانوية (شات / دروس) */
        .sub-tabs { display: flex; background: #111827; border-bottom: 1px solid #1f2937; }
        .sub-tab-btn { flex: 1; padding: 10px; text-align: center; background: none; border: none; color: #9ca3af; font-weight: 600; font-size: 0.85rem; cursor: pointer; border-bottom: 2px solid transparent; }
        .sub-tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

        /* منطقة الشات */
        .chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-box { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
        .msg-other { background: #1f2937; color: #f3f4f6; align-self: flex-start; border-bottom-right-radius: 4px; }
        .msg-me { background: #2563eb; color: #ffffff; align-self: flex-end; border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 0.72rem; font-weight: 700; color: #38bdf8; margin-bottom: 2px; display: block; }
        .msg-me .msg-sender { color: #bfdbfe; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; float: left; margin-top: 4px; margin-right: 8px; }

        .input-area { padding: 12px; background: #111827; border-top: 1px solid #1f2937; display: flex; gap: 8px; }
        input[type="text"]#userInput { flex: 1; padding: 10px 14px; border: 1px solid #374151; background: #1f2937; color: #fff; border-radius: 20px; outline: none; font-size: 0.9rem; }
        input[type="text"]#userInput:focus { border-color: #2563eb; }
        button#sendBtn { background: #2563eb; color: #fff; border: none; padding: 0 18px; border-radius: 20px; font-weight: 600; cursor: pointer; }

        /* منطقة الملخصات والدروس */
        .lessons-view { flex: 1; padding: 16px; overflow-y: auto; display: none; }
        .lesson-card { background: #1f2937; padding: 14px; border-radius: 12px; margin-bottom: 12px; border-right: 4px solid #2563eb; }
        .lesson-card h3 { font-size: 0.95rem; color: #38bdf8; margin-bottom: 6px; }
        .lesson-card p { font-size: 0.85rem; color: #d1d5db; line-height: 1.5; }

        /* القائمة السفلى للتنقل (Bottom Bar) */
        .bottom-nav { background: #111827; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; padding: 8px 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: #6b7280; font-size: 0.75rem; cursor: pointer; flex: 1; }
        .nav-item .icon { font-size: 1.2rem; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>📜 B4C آداب وفلسفة</h1>
        <div class="user-chip">
            <span>👤</span>
            <input type="text" id="usernameInput" placeholder="اسمك...">
        </div>
    </header>

    <div class="main-content">
        <!-- التبويبات الداخلية (دردشة / ملخصات) -->
        <div class="sub-tabs" id="subTabs">
            <button class="sub-tab-btn active" onclick="switchSubTab('chat')">💬 الدردشة الحية</button>
            <button class="sub-tab-btn" id="lessonsTabBtn" onclick="switchSubTab('lessons')">📚 الدروس والملخصات</button>
        </div>

        <!-- واجهة الدردشة -->
        <div class="chat-view" id="chatView">
            <div class="messages" id="messages">
                <div class="msg-box msg-other">
                    <span class="msg-sender">النظام</span>
                    جاري تحميل المحادثة...
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="اكتب مشاركتك...">
                <button id="sendBtn">إرسال</button>
            </div>
        </div>

        <!-- واجهة الدروس -->
        <div class="lessons-view" id="lessonsView">
            <div id="lessonsContainer"></div>
        </div>
    </div>

    <!-- الشريط السفلي لتغيير المادة -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchMainRoom('general', 'عامة', this)">
            <span class="icon">💬</span>
            <span>الدردشة</span>
        </button>
        <button class="nav-item" onclick="switchMainRoom('philo', 'فلسفة', this)">
            <span class="icon">🧠</span>
            <span>الفلسفة</span>
        </button>
        <button class="nav-item" onclick="switchMainRoom('arabic', 'أدب', this)">
            <span class="icon">📚</span>
            <span>الأدب</span>
        </button>
        <button class="nav-item" onclick="switchMainRoom('history', 'تاريخ/جغرافيا', this)">
            <span class="icon">🌍</span>
            <span>إجتماعيات</span>
        </button>
    </nav>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
      import { getDatabase, ref, push, onValue, off } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCi8tBwbrQ2N3HPK266BnyLBbNIBZ1ggsg",
        authDomain: "bac-af.firebaseapp.com",
        databaseURL: "https://bac-af-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bac-af",
        storageBucket: "bac-af.firebasestorage.app",
        messagingSenderId: "682004900162",
        appId: "1:682004900162:web:6e74a6308b9e713dd600db",
        measurementId: "G-SMW8DZY8EX"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const messagesContainer = document.getElementById('messages');
      const userInput = document.getElementById('userInput');
      const usernameInput = document.getElementById('usernameInput');
      const sendBtn = document.getElementById('sendBtn');
      const lessonsContainer = document.getElementById('lessonsContainer');

      let currentRoom = 'general';
      let currentRef = null;
      const myClientId = 'user_' + Math.random().toString(36).substr(2, 9);

      // حفظ الاسم
      usernameInput.value = localStorage.getItem('bac_user_name') || 'طالب';
      usernameInput.addEventListener('input', () => {
          localStorage.setItem('bac_user_name', usernameInput.value.trim());
      });

      // قاعدة بيانات الملخصات
      const lessonsData = {
          general: `<div class="lesson-card"><h3>مرحباً بك!</h3><p>هذه المساحة مخصصة للحديث الحر والتعارف بين طلاب بكالوريا آداب وفلسفة.</p></div>`,
          philo: `
            <div class="lesson-card"><h3>مقالة: الشعور واللاشعور</h3><p>هل الحياة النفسية تقوم كلها على ما هو شعوري فقط؟ (جدل بين المدرسة الكلاسيكية ومدرسة التحليل النفسي).</p></div>
            <div class="lesson-card"><h3>مقالة: أصل الرياضيات</h3><p>هل النفاذ إلى المفاهيم الرياضية يعود إلى العقل أم التجربة الحسية؟</p></div>
          `,
          arabic: `
            <div class="lesson-card"><h3>القواعد: إعراب إذْ وإذًا</h3><p>ملخص سريع للفرق بين إذ الحينية، الظرفية، والتعليلية مع الأمثلة المعربة.</p></div>
            <div class="lesson-card"><h3>البلاغة: المجاز المرسل</h3><p>علاقات المجاز المرسل (السببية، المسببية، الجزئية، الكلية) وكيفية استخراجه.</p></div>
          `,
          history: `
            <div class="lesson-card"><h3>تاريخ: معايير تشكل العالم</h3><p>المعايير التاريخية، الاقتصادية، الاجتماعية والعلمية بعد الحرب العالمية الثانية.</p></div>
            <div class="lesson-card"><h3>جغرافيا: القوى الاقتصادية الكبرى</h3><p>مصطلحات ومفاهيم البترول، العولمة، والتكتلات الاقتصادية.</p></div>
          `
      };

      // التبديل بين التبويبات الفرعية (دردشة / دروس)
      window.switchSubTab = function(type) {
          document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
          if(type === 'chat') {
              document.querySelectorAll('.sub-tab-btn')[0].classList.add('active');
              document.getElementById('chatView').style.display = 'flex';
              document.getElementById('lessonsView').style.display = 'none';
          } else {
              document.querySelectorAll('.sub-tab-btn')[1].classList.add('active');
              document.getElementById('chatView').style.display = 'none';
              document.getElementById('lessonsView').style.display = 'block';
          }
      };

      // التبديل بين المواد الرئيسية
      window.switchMainRoom = function(roomKey, title, btn) {
          currentRoom = roomKey;
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          btn.classList.add('active');

          lessonsContainer.innerHTML = lessonsData[roomKey] || '<p>لا توجد دروس حالياً.</p>';

          // إذا كانت الغرفة عامة نخفي تبويب الدروس
          if(roomKey === 'general') {
              document.getElementById('lessonsTabBtn').style.display = 'none';
              switchSubTab('chat');
          } else {
              document.getElementById('lessonsTabBtn').style.display = 'block';
          }

          if (currentRef) off(currentRef);
          listenToRoom(roomKey);
      };

      function listenToRoom(room) {
          currentRef = ref(db, 'rooms/' + room);
          onValue(currentRef, (snapshot) => {
              messagesContainer.innerHTML = '';
              const data = snapshot.val();
              if (data) {
                  Object.values(data).forEach((msg) => {
                      const isMe = msg.clientId === myClientId;
                      const div = document.createElement('div');
                      div.className = `msg-box ${isMe ? 'msg-me' : 'msg-other'}`;
                      
                      const date = new Date(msg.timestamp || Date.now());
                      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                      div.innerHTML = `
                          <span class="msg-sender">${isMe ? 'أنت' : (msg.sender || 'طالب')}</span>
                          ${msg.text}
                          <span class="msg-time">${timeStr}</span>
                      `;
                      messagesContainer.appendChild(div);
                  });
              } else {
                  messagesContainer.innerHTML = '<div class="msg-box msg-other"><span class="msg-sender">النظام</span>لا توجد رسائل بعد، ابدأ النقاش!</div>';
              }
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
          });
      }

      function sendMessage() {
          const text = userInput.value.trim();
          const senderName = usernameInput.value.trim() || "طالب";
          if (text !== '') {
              push(ref(db, 'rooms/' + currentRoom), {
                  sender: senderName,
                  text: text,
                  clientId: myClientId,
                  timestamp: Date.now()
              });
              userInput.value = '';
          }
      }

      sendBtn.addEventListener('click', sendMessage);
      userInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') sendMessage();
      });

      // تشغيل الغرفة العامة افتراضياً
      switchMainRoom('general', 'عامة', document.querySelectorAll('.nav-item')[0]);
    </script>
</body>
</html>

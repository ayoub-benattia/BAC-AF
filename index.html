<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="منصة B4C لطلاب البكالوريا شعبة الآداب والفلسفة">
  <title>B4C | منصة الآداب والفلسفة</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: #151f32;
      --surface2: #202d43;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #a5b4c8;
      --border: #304158;
      --danger: #f87171;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .hidden { display: none !important; }

    .muted { color: var(--muted); }
    .accent { color: var(--accent); }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 34px 24px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 70px #0003;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin-bottom: 16px;
      border-radius: 20px;
      background: #38bdf81c;
      color: var(--accent);
      font-size: 30px;
    }

    h1 { margin: 0 0 10px; font-size: 1.7rem; }
    p { line-height: 1.7; }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface2);
      font-weight: 700;
    }

    .btn-primary {
      color: #071421;
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-google {
      width: 100%;
      margin-top: 16px;
      background: #fff;
      color: #111827;
      border-color: #fff;
    }

    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .error {
      margin-top: 14px;
      color: var(--danger);
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px max(16px, calc((100% - 960px) / 2));
      background: #151f32ed;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .brand {
      color: var(--accent);
      font-weight: 900;
      font-size: 1.05rem;
    }

    .user-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      max-width: 145px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .85rem;
    }

    .logout {
      color: var(--danger);
      background: #f8717114;
      border-color: #f8717130;
    }

    main {
      width: min(100% - 32px, 920px);
      margin: 26px auto;
      padding-bottom: 24px;
    }

    .hero { margin-bottom: 24px; }
    .hero h2 { margin-bottom: 6px; font-size: 1.55rem; }
    .hero p { margin-top: 0; color: var(--muted); }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .subject-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-height: 155px;
      padding: 20px;
      text-align: right;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .2s, transform .2s;
    }

    .subject-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .subject-icon { font-size: 1.8rem; }
    .subject-card strong { font-size: 1.05rem; }
    .subject-card small { color: var(--muted); line-height: 1.6; }

    .tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 30px;
      color: var(--accent);
      background: #38bdf815;
      font-size: .75rem;
    }

    .chat-page { display: flex; flex-direction: column; gap: 14px; }

    .chat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-top h2 { margin: 0; font-size: 1.25rem; }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: min(68vh, 680px);
      min-height: 350px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .chat-status {
      padding: 10px 15px;
      color: var(--muted);
      font-size: .8rem;
      border-bottom: 1px solid var(--border);
    }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      overflow-wrap: anywhere;
      overscroll-behavior: contain;
    }

    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
    }

    .message {
      max-width: 86%;
      align-self: flex-start;
      padding: 10px 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 15px 4px 15px 15px;
    }

    .message.mine {
      align-self: flex-end;
      background: #173b66;
      border-color: #28578a;
      border-radius: 4px 15px 15px 15px;
    }

    .message-author {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
    }

    .message-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      user-select: text;
      -webkit-user-select: text;
    }

    .message-time {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .68rem;
    }

    .reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .reaction-btn {
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #0b1120;
      color: var(--text);
    }

    .reaction-btn.active { border-color: var(--accent); }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .composer input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .composer input::placeholder { color: var(--muted); }

    .counter {
      padding: 0 14px 8px;
      color: var(--muted);
      font-size: .72rem;
      text-align: left;
    }

    footer {
      padding: 22px 16px;
      color: var(--muted);
      text-align: center;
      font-size: .8rem;
    }

    @media (max-width: 560px) {
      header { padding: 12px 14px; }
      .user-name { display: none; }
      main { width: calc(100% - 24px); margin-top: 20px; }
      .cards { grid-template-columns: 1fr; }
      .subject-card { min-height: 125px; }
      .chat-box { height: 65vh; min-height: 320px; }
      .message { max-width: 94%; }
      .chat-top h2 { font-size: 1.05rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <section id="authScreen" class="screen">
    <div class="auth-card">
      <div class="logo" aria-hidden="true">📚</div>
      <h1 class="accent">منصة B4C</h1>
      <p class="muted">فضاء المراجعة والتعاون لطلاب الآداب والفلسفة</p>
      <button id="googleLoginBtn" class="btn btn-google" type="button">
        <span aria-hidden="true">G</span>
        متابعة باستخدام Google
      </button>
      <p id="authError" class="error" role="alert" aria-live="polite"></p>
    </div>
  </section>

  <div id="appArea" class="hidden">
    <header>
      <div class="brand">📜 B4C | بكالوريا</div>
      <div class="user-nav">
        <span id="userName" class="user-name"></span>
        <button id="logoutBtn" class="btn logout" type="button">
          تسجيل الخروج
        </button>
      </div>
    </header>

    <main>
      <section id="homePage">
        <div class="hero">
          <h2>موادك الدراسية 🎓</h2>
          <p>اختار المادة، راجع دروسك وناقش مع زملائك.</p>
        </div>

        <div class="cards">
          <button class="subject-card" data-room="philo" data-title="الفلسفة" type="button">
            <span class="subject-icon">🧠</span>
            <strong>الفلسفة</strong>
            <small>المقالات الجدلية والاستقصائية</small>
            <span class="tag">معامل 6</span>
          </button>

          <button class="subject-card" data-room="arabic" data-title="اللغة العربية" type="button">
            <span class="subject-icon">📚</span>
            <strong>اللغة العربية</strong>
            <small>القواعد والبلاغة والنقد</small>
            <span class="tag">معامل 5</span>
          </button>

          <button class="subject-card" data-room="history" data-title="التاريخ والجغرافيا" type="button">
            <span class="subject-icon">🌍</span>
            <strong>التاريخ والجغرافيا</strong>
            <small>المصطلحات والتواريخ والخرائط</small>
            <span class="tag">معامل 4</span>
          </button>

          <button class="subject-card" data-room="general" data-title="المنتدى العام" type="button">
            <span class="subject-icon">💬</span>
            <strong>المنتدى العام</strong>
            <small>أسئلة ومناقشات عامة</small>
            <span class="tag">عام</span>
          </button>
        </div>
      </section>

      <section id="subjectView" class="chat-page hidden">
        <div class="chat-top">
          <button id="backBtn" class="btn" type="button">→ المواد</button>
          <h2 id="subjectTitle">المناقشة</h2>
        </div>

        <div class="chat-box">
          <div id="chatStatus" class="chat-status" role="status">
            جاري الاتصال...
          </div>

          <div id="chatMessages" class="messages" aria-live="polite">
            <p class="empty">جاري تحميل الرسائل...</p>
          </div>

          <form id="chatForm" class="composer">
            <input
              id="userInput"
              type="text"
              maxlength="1000"
              autocomplete="off"
              placeholder="اكتب رسالتك..."
              aria-label="نص الرسالة"
              required
            >
            <button id="sendBtn" class="btn btn-primary" type="submit">
              إرسال
            </button>
          </form>
          <div id="charCounter" class="counter">0 / 1000</div>
        </div>

        <p id="chatError" class="error" role="alert" aria-live="polite"></p>
      </section>
    </main>

    <footer>منصة B4C — بالتوفيق في البكالوريا ✨</footer>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      onValue,
      off,
      query,
      orderByChild,
      limitToLast,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    // استعمل إعدادات مشروعك الحقيقية من Firebase Console.
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const $ = (id) => document.getElementById(id);

    const authScreen = $("authScreen");
    const appArea = $("appArea");
    const loginBtn = $("googleLoginBtn");
    const logoutBtn = $("logoutBtn");
    const authError = $("authError");
    const homePage = $("homePage");
    const subjectView = $("subjectView");
    const subjectTitle = $("subjectTitle");
    const chatMessages = $("chatMessages");
    const chatStatus = $("chatStatus");
    const chatError = $("chatError");
    const chatForm = $("chatForm");
    const userInput = $("userInput");
    const sendBtn = $("sendBtn");
    const charCounter = $("charCounter");

    const MAX_MESSAGE_LENGTH = 1000;
    const ALLOWED_ROOMS = new Set([
      "philo", "arabic", "history", "general"
    ]);
    const EMOJIS = ["👍", "😂", "😮", "😢", "🚩"];

    let currentUser = null;
    let currentRoom = null;
    let messagesRef = null;
    let reactionsRef = null;
    let messagesQuery = null;
    let messagesCache = {};
    let reactionsCache = {};
    let loading = false;
    let messagesReady = false;
    let reactionsReady = false;
    let authReady = false;
    let authRequestPending = false;
    let loginRequestPending = false;
    let unsubscribeAuth = null;
    let stopMessages = null;
    let stopReactions = null;
    let roomGeneration = 0;
    let lastMessageIds = [];

    function showError(element, message = "") {
      element.textContent = message;
    }

    function errorMessage(error) {
      const messages = {
        "auth/unauthorized-domain":
          "هذا النطاق غير مسموح به. أضفه إلى Authorized domains.",
        "auth/popup-blocked":
          "المتصفح منع نافذة تسجيل الدخول. أعد المحاولة.",
        "auth/network-request-failed":
          "تحقق من اتصال الإنترنت وحاول مجدداً.",
        "auth/too-many-requests":
          "محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.",
        "auth/operation-not-allowed":
          "تسجيل الدخول بـ Google غير مفعّل في Firebase.",
        "auth/operation-not-supported-in-this-environment":
          "افتح الموقع عبر HTTPS أو خادم محلي مدعوم."
      };

      return messages[error?.code] ||
        "تعذّر إكمال العملية. تحقق من إعدادات Firebase وحاول مجدداً.";
    }

    function stopRoomListeners() {
      if (stopMessages) stopMessages();
      if (stopReactions) stopReactions();

      stopMessages = null;
      stopReactions = null;
      messagesRef = null;
      reactionsRef = null;
      messagesQuery = null;
    }

    function resetRoom() {
      roomGeneration++;
      stopRoomListeners();
      currentRoom = null;
      messagesCache = {};
      reactionsCache = {};
      lastMessageIds = [];
      messagesReady = false;
      reactionsReady = false;
      loading = false;
    }

    function renderEmpty(message) {
      chatMessages.replaceChildren();

      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = message;
      chatMessages.appendChild(p);
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderMessages(shouldScroll = false) {
      if (!messagesReady || !reactionsReady) return;

      const oldScroll = chatMessages.scrollTop;
      const nearBottom =
        chatMessages.scrollHeight -
        chatMessages.scrollTop -
        chatMessages.clientHeight < 100;

      const fragment = document.createDocumentFragment();
      const ids = Object.keys(messagesCache);

      if (ids.length === 0) {
        renderEmpty("ما كاش رسائل بعد. كون أول واحد يشارك! 💬");
        return;
      }

      ids.forEach((id) => {
        const msg = messagesCache[id];

        if (!msg || typeof msg.text !== "string" ||
            typeof msg.uid !== "string") return;

        const mine = currentUser && msg.uid === currentUser.uid;
        const card = makeElement(
          "article",
          "message" + (mine ? " mine" : "")
        );

        const author = makeElement(
          "span",
          "message-author",
          mine ? "أنت" : "طالب"
        );

        const text = makeElement("div", "message-text", msg.text);

        card.append(author, text);

        if (typeof msg.timestamp === "number") {
          const date = new Date(msg.timestamp);
          const time = makeElement(
            "time",
            "message-time",
            date.toLocaleTimeString("ar-DZ", {
              hour: "2-digit",
              minute: "2-digit"
            })
          );
          card.appendChild(time);
        }

        const messageReactions = reactionsCache[id] || {};
        const counts = new Map();

        Object.values(messageReactions).forEach((emoji) => {
          if (EMOJIS.includes(emoji)) {
            counts.set(emoji, (counts.get(emoji) || 0) + 1);
          }
        });

        if (counts.size) {
          const row = makeElement("div", "reactions");

          counts.forEach((count, emoji) => {
            const button = makeElement(
              "button",
              "reaction-btn" +
                (messageReactions[currentUser.uid] === emoji
                  ? " active" : ""),
              `${emoji} ${count}`
            );

            button.type = "button";
            button.setAttribute(
              "aria-label",
              `تفاعل ${emoji}، عدد التفاعلات ${count}`
            );

            button.addEventListener("click", () => {
              addReaction(id, emoji);
            });

            row.appendChild(button);
          });

          card.appendChild(row);
        }

        const reactButton = makeElement(
          "button", "reaction-btn", "😊 تفاعل"
        );
        reactButton.type = "button";
        reactButton.addEventListener("click", () => {
          openReactionPicker(id);
        });
        card.appendChild(reactButton);

        fragment.appendChild(card);
      });

      chatMessages.replaceChildren(fragment);

      if (shouldScroll || nearBottom) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } else {
        chatMessages.scrollTop = oldScroll;
      }
    }

    function openSubject(room, title) {
      if (!currentUser || !authReady) return;
      if (!ALLOWED_ROOMS.has(room)) return;

      resetRoom();

      currentRoom = room;
      subjectTitle.textContent = title;
      homePage.classList.add("hidden");
      subjectView.classList.remove("hidden");
      showError(chatError);

      renderEmpty("جاري تحميل الرسائل...");
      chatStatus.textContent = "جاري الاتصال...";
      userInput.value = "";
      charCounter.textContent = "0 / 1000";

      const generation = roomGeneration;
      messagesRef = ref(db, `rooms/${room}/messages`);
      reactionsRef = ref(db, `rooms/${room}/reactions`);

      messagesQuery = query(
        messagesRef,
        orderByChild("timestamp"),
        limitToLast(100)
      );

      stopMessages = onValue(
        messagesQuery,
        (snapshot) => {
          if (generation !== roomGeneration) return;

          messagesCache = snapshot.val() || {};
          messagesReady = true;
          chatStatus.textContent = "آخر 100 رسالة";
          renderMessages(true);
        },
        (error) => {
          if (generation !== roomGeneration) return;
          chatStatus.textContent = "تعذّر تحميل الرسائل";
          showError(chatError, errorMessage(error));
        }
      );

      stopReactions = onValue(
        reactionsRef,
        (snapshot) => {
          if (generation !== roomGeneration) return;
          reactionsCache = snapshot.val() || {};
          reactionsReady = true;
          renderMessages();
        },
        (error) => {
          if (generation !== roomGeneration) return;
          showError(chatError, errorMessage(error));
        }
      );
    }

    function showHome() {
      resetRoom();
      subjectView.classList.add("hidden");
      homePage.classList.remove("hidden");
      showError(chatError);
    }

    async function addReaction(messageId, emoji) {
      if (!currentUser || !currentRoom ||
          !EMOJIS.includes(emoji)) return;

      if (!Object.hasOwn(messagesCache, messageId)) return;

      const target = ref(
        db,
        `rooms/${currentRoom}/reactions/${messageId}/${currentUser.uid}`
      );

      try {
        const previous =
          reactionsCache[messageId]?.[currentUser.uid];

        // الضغط على نفس التفاعل مرة أخرى يزيله.
        if (previous === emoji) {
          await set(target, null);
        } else {
          await set(target, emoji);
        }
      } catch (error) {
        showError(chatError, errorMessage(error));
      }
    }

    function openReactionPicker(messageId) {
      const selected = window.prompt(
        "اختر رقماً للتفاعل:\n1 👍\n2 😂\n3 😮\n4 😢\n5 🚩"
      );

      const index = Number(selected) - 1;
      if (!Number.isInteger(index) ||
          index < 0 || index >= EMOJIS.length) return;

      addReaction(messageId, EMOJIS[index]);
    }

    async function sendMessage(event) {
      event.preventDefault();

      if (loading || !currentUser || !currentRoom ||
          !authReady || !ALLOWED_ROOMS.has(currentRoom)) return;

      const text = userInput.value.trim();

      if (!text) return;

      if (text.length > MAX_MESSAGE_LENGTH) {
        showError(chatError, "الرسالة طويلة بزاف.");
        return;
      }

      loading = true;
      sendBtn.disabled = true;
      showError(chatError);

      try {
        const newMessage = push(
          ref(db, `rooms/${currentRoom}/messages`)
        );

        await set(newMessage, {
          uid: currentUser.uid,
          text,
          timestamp: serverTimestamp()
        });

        userInput.value = "";
        charCounter.textContent = "0 / 1000";
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (error) {
        showError(chatError, errorMessage(error));
      } finally {
        loading = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    loginBtn.addEventListener("click", async () => {
      if (loginRequestPending) return;

      loginRequestPending = true;
      loginBtn.disabled = true;
      showError(authError);

      try {
        await signInWithRedirect(auth, provider);
      } catch (error) {
        showError(authError, errorMessage(error));
        loginRequestPending = false;
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;

      try {
        resetRoom();
        await signOut(auth);
      } catch (error) {
        showError(chatError, errorMessage(error));
      } finally {
        logoutBtn.disabled = false;
      }
    });

    document.querySelectorAll("[data-room]").forEach((button) => {
      button.addEventListener("click", () => {
        openSubject(button.dataset.room, button.dataset.title);
      });
    });

    $("backBtn").addEventListener("click", showHome);
    chatForm.addEventListener("submit", sendMessage);

    userInput.addEventListener("input", () => {
      charCounter.textContent =
        `${userInput.value.length} / ${MAX_MESSAGE_LENGTH}`;
    });

    // ما نخليوش أخطاء نتيجة إعادة التوجيه مخفية.
    getRedirectResult(auth).catch((error) => {
      showError(authError, errorMessage(error));
    });

    unsubscribeAuth = onAuthStateChanged(
      auth,
      (user) => {
        authReady = true;
        currentUser = user;

        if (user) {
          authScreen.classList.add("hidden");
          appArea.classList.remove("hidden");
          $("userName").textContent = user.displayName || "طالب";
          loginRequestPending = false;
          loginBtn.disabled = false;
        } else {
          resetRoom();
          authScreen.classList.remove("hidden");
          appArea.classList.add("hidden");
          $("userName").textContent = "";
          showError(chatError);
          loginRequestPending = false;
          loginBtn.disabled = false;
        }
      },
      (error) => {
        authReady = true;
        currentUser = null;
        resetRoom();
        authScreen.classList.remove("hidden");
        appArea.classList.add("hidden");
        showError(authError, errorMessage(error));
      }
    );

    window.addEventListener("pagehide", () => {
      stopRoomListeners();
      if (unsubscribeAuth) unsubscribeAuth();
    });
  </script>
</body>
</html>

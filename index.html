<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الآداب والفلسفة - B4C</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* الهيدر العلوي */
        header { background-color: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.2rem; color: #38bdf8; }
        .user-chip { background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .user-chip input { background: transparent; border: none; color: #38bdf8; font-weight: bold; width: 110px; outline: none; }

        /* الشاشة الرئيسية */
        .app-layout { display: flex; flex: 1; overflow: hidden; }

        /* القائمة الجانبية (للكامبيوتر) / العلوية (للعدف) */
        .nav-sidebar { width: 240px; background: #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #334155; flex-shrink: 0; }
        .nav-sidebar h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .nav-btn { display: flex; align-items: center; gap: 10px; padding: 12px; background: transparent; color: #cbd5e1; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: right; width: 100%; transition: 0.2s; }
        .nav-btn:hover { background: #334155; color: #fff; }
        .nav-btn.active { background: #2563eb; color: #fff; }

        /* منطقة المحتوى */
        .content-body { flex: 1; display: flex; flex-direction: column; background: #0f172a; overflow: hidden; }

        /* تبويبات التبديل في التليفون */
        .mobile-tabs { display: none; background: #1e293b; border-bottom: 1px solid #334155; }
        .m-tab { flex: 1; padding: 12px; background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; }
        .m-tab.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

        /* تقسيم الشاشة في الكمبيوتر: دروس + شات */
        .main-workspace { flex: 1; display: flex; overflow: hidden; }

        /* قسم الدروس */
        .lessons-panel { width: 320px; background: #182234; padding: 15px; border-left: 1px solid #334155; overflow-y: auto; }
        .lessons-panel h3 { font-size: 1rem; color: #38bdf8; margin-bottom: 12px; }
        .lesson-card { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-right: 3px solid #2563eb; font-size: 0.88rem; line-height: 1.4; }

        /* قسم الشات */
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-box { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; word-break: break-word; }
        .msg-other { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-right-radius: 2px; }
        .msg-me { background: #2563eb; color: #ffffff; align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 0.72rem; font-weight: bold; color: #38bdf8; margin-bottom: 3px; display: block; }
        .msg-me .msg-sender { color: #bfdbfe; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; float: left; margin-top: 4px; margin-right: 8px; }

        .input-area { padding: 12px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; }
        input[type="text"]#userInput { flex: 1; padding: 10px 14px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; outline: none; }
        button#sendBtn { padding: 0 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* تجاوب الشاشة للهواتف (Responsive Mobile View) */
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .nav-sidebar { width: 100%; height: auto; padding: 8px; flex-direction: row; overflow-x: auto; border-left: none; border-bottom: 1px solid #334155; }
            .nav-sidebar h3 { display: none; }
            .nav-btn { width: auto; white-space: nowrap; padding: 8px 14px; font-size: 0.85rem; }
            
            .mobile-tabs { display: flex; }
            .main-workspace { flex-direction: column; }
            .lessons-panel { width: 100%; border-left: none; display: none; }
            .msg-box { max-width: 88%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📜 منصة الآداب والفلسفة - B4C</h1>
        <div class="user-chip">
            <span>👤</span>
            <input type="text" id="usernameInput" placeholder="اسمك...">
        </div>
    </header>

    <div class="app-layout">
        <!-- القائمة الجانبية (للكامبيوتر) / شريط أفقي قابل للسحب (للتليفون) -->
        <nav class="nav-sidebar">
            <h3>الأقسام التعليمية</h3>
            <button class="nav-btn active" onclick="switchSection('general', this)">💬 الدردشة العامة</button>
            <button class="nav-btn" onclick="switchSection('philo', this)">🧠 قسم الفلسفة</button>
            <button class="nav-btn" onclick="switchSection('arabic', this)">📚 الأدب العربي</button>
            <button class="nav-btn" onclick="switchSection('history', this)">🌍 الاجتماعيات</button>
        </nav>

        <div class="content-body">
            <!-- تبويبات الهواتف فقط -->
            <div class="mobile-tabs" id="mobileTabs">
                <button class="m-tab active" id="mChatBtn" onclick="toggleMobileView('chat')">💬 الدردشة الحية</button>
                <button class="m-tab" id="mLessonsBtn" onclick="toggleMobileView('lessons')">📚 الملخصات</button>
            </div>

            <div class="main-workspace">
                <!-- قسم الدروس والملخصات -->
                <div class="lessons-panel" id="lessonsPanel">
                    <h3 id="sectionTitle">الدردشة العامة</h3>
                    <div id="lessonsContent">
                        <p style="color: #94a3b8; font-size: 0.85rem;">مساحة عامة للتعارف وتبادل النظريات والأسئلة بين طلاب الآداب والفلسفة.</p>
                    </div>
                </div>

                <!-- قسم الدردشة -->
                <div class="chat-panel" id="chatPanel">
                    <div class="messages" id="messages">
                        <div class="msg-box msg-other">
                            <span class="msg-sender">النظام</span>
                            جاري الاتصال...
                        </div>
                    </div>
                    <div class="input-area">
                        <input type="text" id="userInput" placeholder="اكتب مشاركتك هنا...">
                        <button id="sendBtn">إرسال</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
      import { getDatabase, ref, push, onValue, off } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCi8tBwbrQ2N3HPK266BnyLBbNIBZ1ggsg",
        authDomain: "bac-af.firebaseapp.com",
        databaseURL: "https://bac-af-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bac-af",
        storageBucket: "bac-af.firebasestorage.app",
        messagingSenderId: "682004900162",
        appId: "1:682004900162:web:6e74a6308b9e713dd600db",
        measurementId: "G-SMW8DZY8EX"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const messagesContainer = document.getElementById('messages');
      const userInput = document.getElementById('userInput');
      const usernameInput = document.getElementById('usernameInput');
      const sendBtn = document.getElementById('sendBtn');
      const sectionTitle = document.getElementById('sectionTitle');
      const lessonsContent = document.getElementById('lessonsContent');

      let currentRoom = 'general';
      let currentRef = null;
      const myClientId = 'user_' + Math.random().toString(36).substr(2, 9);

      usernameInput.value = localStorage.getItem('bac_user_name') || 'طالب';
      usernameInput.addEventListener('input', () => {
          localStorage.setItem('bac_user_name', usernameInput.value.trim());
      });

      const lessonsData = {
          general: {
              title: "💬 الدردشة العامة",
              content: `<p style="color: #94a3b8; font-size: 0.85rem;">مساحة عامة للتعارف وتبادل النظريات والأسئلة بين طلاب الآداب والفلسفة.</p>`
          },
          philo: {
              title: "🧠 قسم الفلسفة",
              content: `
                <div class="lesson-card"><b>مقالة 1:</b> إشكالية الشعور واللاشعور (مخطط جدلي جاهز).</div>
                <div class="lesson-card"><b>مقالة 2:</b> أصل المفاهيم الرياضية (بين العقل والتجربة).</div>
              `
          },
          arabic: {
              title: "📚 الأدب العربي",
              content: `
                <div class="lesson-card"><b>القواعد:</b> إعراب إذْ، إذًا، وإذن بطريقة مبسطة.</div>
                <div class="lesson-card"><b>البلاغة:</b> أهم علاقات المجاز المرسل واستخراجه.</div>
              `
          },
          history: {
              title: "🌍 الاجتماعيات",
              content: `
                <div class="lesson-card"><b>تاريخ:</b> معايير تشكل العالم بعد الحرب العالمية الثانية.</div>
                <div class="lesson-card"><b>جغرافيا:</b> مصطلحات البترول، العولمة والتكتلات.</div>
              `
          }
      };

      window.switchSection = function(roomKey, btn) {
          currentRoom = roomKey;
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const data = lessonsData[roomKey];
          sectionTitle.innerText = data.title;
          lessonsContent.innerHTML = data.content;

          // تحكم في تبويبات الهواتف
          if(window.innerWidth <= 768) {
              if(roomKey === 'general') {
                  document.getElementById('mobileTabs').style.display = 'none';
                  toggleMobileView('chat');
              } else {
                  document.getElementById('mobileTabs').style.display = 'flex';
                  toggleMobileView('chat');
              }
          }

          if (currentRef) off(currentRef);
          listenToRoom(roomKey);
      };

      window.toggleMobileView = function(view) {
          const chatPanel = document.getElementById('chatPanel');
          const lessonsPanel = document.getElementById('lessonsPanel');
          const mChatBtn = document.getElementById('mChatBtn');
          const mLessonsBtn = document.getElementById('mLessonsBtn');

          if(view === 'chat') {
              chatPanel.style.display = 'flex';
              lessonsPanel.style.display = 'none';
              mChatBtn.classList.add('active');
              mLessonsBtn.classList.remove('active');
          } else {
              chatPanel.style.display = 'none';
              lessonsPanel.style.display = 'block';
              mLessonsBtn.classList.add('active');
              mChatBtn.classList.remove('active');
          }
      };

      function listenToRoom(room) {
          currentRef = ref(db, 'rooms/' + room);
          onValue(currentRef, (snapshot) => {
              messagesContainer.innerHTML = '';
              const data = snapshot.val();
              if (data) {
                  Object.values(data).forEach((msg) => {
                      const isMe = msg.clientId === myClientId;
                      const div = document.createElement('div');
                      div.className = `msg-box ${isMe ? 'msg-me' : 'msg-other'}`;
                      
                      const date = new Date(msg.timestamp || Date.now());
                      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                      div.innerHTML = `
                          <span class="msg-sender">${isMe ? 'أنت' : (msg.sender || 'طالب')}</span>
                          ${msg.text}
                          <span class="msg-time">${timeStr}</span>
                      `;
                      messagesContainer.appendChild(div);
                  });
              } else {
                  messagesContainer.innerHTML = '<div class="msg-box msg-other"><span class="msg-sender">النظام</span>لا توجد رسائل بعد، ابدأ النقاش!</div>';
              }
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
          });
      }

      function sendMessage() {
          const text = userInput.value.trim();
          const senderName = usernameInput.value.trim() || "طالب";
          if (text !== '') {
              push(ref(db, 'rooms/' + currentRoom), {
                  sender: senderName,
                  text: text,
                  clientId: myClientId,
                  timestamp: Date.now()
              });
              userInput.value = '';
          }
      }

      sendBtn.addEventListener('click', sendMessage);
      userInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') sendMessage();
      });

      // التشغيل الافتراضي
      switchSection('general', document.querySelectorAll('.nav-btn')[0]);
    </script>
</body>
</html>

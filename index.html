<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملتقى الفلسفة والآداب - باك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; color: #fff; padding: 15px 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 250px; background-color: #0f172a; color: #fff; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #ffffff; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #e2e8f0; padding: 10px 14px; border-radius: 12px; max-width: 75%; width: fit-content; word-break: break-word; }
        .input-area { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        button { padding: 12px 24px; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1d4ed8; }
        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

    <header>
        <h2>فضاء الآداب والفلسفة - B4C</h2>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h3>الغرف</h3>
            <p>💬 الدردشة العامة</p>
            <p>📜 مقالات الفلسفة</p>
        </div>
        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="msg"><b>النظام:</b> مرحباً بكم! متصل بقاعدة البيانات...</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="اكتب مشاركتك الفلسفية هنا...">
                <button id="sendBtn">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
      import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCi8tBwbrQ2N3HPK266BnyLBbNIBZ1ggsg",
        authDomain: "bac-af.firebaseapp.com",
        databaseURL: "https://bac-af-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bac-af",
        storageBucket: "bac-af.firebasestorage.app",
        messagingSenderId: "682004900162",
        appId: "1:682004900162:web:6e74a6308b9e713dd600db",
        measurementId: "G-SMW8DZY8EX"
      };

      // Initialize Firebase & Realtime Database
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const messagesRef = ref(db, 'messages');

      const messagesContainer = document.getElementById('messages');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');

      // 1. استقبال الرسائل اللحظية (Realtime)
      onValue(messagesRef, (snapshot) => {
          messagesContainer.innerHTML = '';
          const data = snapshot.val();
          if (data) {
              Object.values(data).forEach((msg) => {
                  const div = document.createElement('div');
                  div.className = 'msg';
                  div.innerHTML = `<b>طالب:</b> ${msg.text}`;
                  messagesContainer.appendChild(div);
              });
          } else {
              messagesContainer.innerHTML = '<div class="msg"><b>النظام:</b> لا توجد رسائل بعد، أرسل أول رسالة!</div>';
          }
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });

      // 2. إرسال الرسالة
      function sendMessage() {
          const text = userInput.value.trim();
          if (text !== '') {
              push(messagesRef, {
                  text: text,
                  timestamp: Date.now()
              });
              userInput.value = '';
          }
      }

      sendBtn.addEventListener('click', sendMessage);
      userInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') sendMessage();
      });
    </script>
</body>
</html>
